<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 72" width="240" height="72" fill="none" color="#57606a"><style>.life{transform-box:fill-box;transform-origin:left center;animation:drain 4.5s linear infinite}.send{transform-box:fill-box;transform-origin:center;animation:send 4.5s ease-out infinite}@keyframes drain{0%{transform:scaleX(1)}90%{transform:scaleX(.1)}100%{transform:scaleX(1)}}@keyframes send{0%,86%{opacity:0;transform:scale(.6)}92%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.8)}}@media (prefers-reduced-motion:reduce){.life,.send{animation:none}}</style><rect x="40" y="30" width="176" height="12" rx="6" stroke="currentColor" stroke-opacity=".35"/><rect class="life" x="40" y="30" width="176" height="12" rx="6" fill="currentColor" fill-opacity=".55"/><circle cx="22" cy="36" r="5" fill="currentColor" fill-opacity=".8"/><circle class="send" cx="22" cy="36" r="9" stroke="currentColor" stroke-width="2"/></svg>
